<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Reading Log">
<meta name="theme-color" content="#0b0d11" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f4f6" media="(prefers-color-scheme: light)">
<meta name="color-scheme" content="dark light">
<meta name="robots" content="noindex,nofollow">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Reading Log</title>
<style>
:root{--bg:#0b0d11;--card:#12151b;--border:#2a303c;--fg:#eef0f4;--muted:#9aa3b2;--accent:#f0a62f;--accent-fg:#1a1203;--neg:#f0645a;color-scheme:dark light}
@media(prefers-color-scheme:light){:root{--bg:#f3f4f6;--card:#fff;--border:#dadee6;--fg:#13171e;--muted:#566070;--neg:#c0372c}}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--fg);font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;overflow:hidden;-webkit-text-size-adjust:100%}
#app{position:fixed;top:0;left:0;width:100%;height:100%;border:0;background:var(--bg)}
#app[hidden],.screen[hidden]{display:none}
.screen{position:fixed;inset:0;display:grid;place-items:center;padding:24px;background:var(--bg);z-index:5}
.box{width:min(360px,100%);display:grid;gap:12px;padding:20px;background:var(--card);border:1px solid var(--border);border-radius:14px}
h1{font-size:20px;font-weight:600}
p,li{color:var(--muted);font-size:15px}
#msg{color:var(--neg);min-height:1.4em}
input{width:100%;min-height:48px;font:600 22px/1 inherit;text-align:center;letter-spacing:.2em;color:var(--fg);background:transparent;border:1px solid var(--border);border-radius:10px;padding:10px}
input:focus{outline:2px solid var(--accent);outline-offset:1px}
button{min-height:46px;font:600 16px inherit;border:0;border-radius:10px;background:var(--accent);color:var(--accent-fg)}
ol{display:grid;gap:8px;padding-left:20px}
b{color:var(--fg)}
#probe{position:fixed;left:0;top:0;width:1px;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
</style></head><body>
<div id="probe"></div>

<form class="screen" id="pin" hidden><div class="box">
  <h1>Reading Log</h1><p>Enter your PIN. You only need to do this once on this phone.</p>
  <input id="pininp" type="password" inputmode="numeric" autocomplete="off" aria-label="PIN">
  <div id="msg" role="alert"></div>
  <button type="submit">Unlock</button>
</div></form>

<div class="screen" id="install" hidden><div class="box">
  <h1>Add to your Home Screen</h1>
  <ol>
    <li>Tap <b>Share</b> in Safari.</li>
    <li>Tap <b>Add to Home Screen</b>.</li>
    <li>Make sure <b>Open as Web App</b> is on.</li>
    <li>Tap <b>Add</b>.</li>
  </ol>
  <p>Then open Reading Log from your Home Screen.</p>
</div></div>

<iframe id="app" title="Reading Log" hidden allow="clipboard-write"></iframe>

<script>
(function () {
  // ===== The only line you need to edit: your Apps Script web app link (ends in /exec) =====
  var APP_URL = 'https://script.google.com/macros/s/AKfycbzQtS20ldw4hWJYF2Yh5Z2Vg3gvSDTtOfnBc0lquDuZh13pRfQybeqrRmeaW1UZv-U4/exec';
  // ========================================================================================

  var KEY = 'readinglog-pin', RKEY = 'readinglog-reserved';
  var $ = function (id) { return document.getElementById(id); };
  var frame = $('app');
  var standalone = navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
  function get(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
  function put(k, v) { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch (e) {} }

  // ---- install mode: only when opened in Safari (not as an installed app) with ?install ----
  if (/[?&]install\b/.test(location.search) && !standalone) {
    $('install').hidden = false;
    history.replaceState(null, '', location.pathname);   // so the saved Home Screen address is clean
    return;
  }

  // ---- screen insets, measured from the hidden probe (0 to 80 px) ----
  function inset(side) {
    var v = parseFloat(getComputedStyle($('probe'))['padding' + side]) || 0;
    return Math.max(0, Math.min(80, Math.round(v)));
  }

  // ---- fit the iframe to the full screen, plus whatever Google's page leaves empty at the bottom ----
  var reserved = Math.max(0, Math.min(120, parseInt(get(RKEY), 10) || 0));
  function fit() {
    var portrait = innerHeight >= innerWidth;
    if (standalone && portrait) {
      frame.style.height = (Math.max(innerHeight, screen.height) + reserved) + 'px';
    } else {
      frame.style.height = '100%';
    }
  }
  addEventListener('resize', fit);
  addEventListener('orientationchange', function () { setTimeout(fit, 150); });

  // ---- load the app ----
  function start(pin) {
    if (/PASTE_YOUR_DEPLOYMENT_ID_HERE/.test(APP_URL)) {
      showPin('Set APP_URL at the top of index.html to your Apps Script link first.');
      return;
    }
    $('pin').hidden = true;
    fit();
    frame.hidden = false;
    frame.src = APP_URL + '?k=' + encodeURIComponent(pin) + '&st=' + inset('Top') + '&sb=' + inset('Bottom');
  }
  function showPin(message) {
    frame.hidden = true;
    frame.src = 'about:blank';
    $('msg').textContent = message || '';
    $('pin').hidden = false;
    $('pininp').value = '';
  }

  $('pin').addEventListener('submit', function (e) {
    e.preventDefault();
    var v = $('pininp').value.trim();
    if (!v) return;
    put(KEY, v);
    start(v);
  });

  // ---- messages from the app ----
  var PIN_TEXT = {
    PIN_NOT_SET: 'No PIN is set yet. Add APP_PIN under Script properties in Apps Script, then try again.',
    PIN_WRONG: "That PIN didn't work. Try again.",
    PIN_LOCKED: 'Too many wrong PINs. Try again in an hour.'
  };
  addEventListener('message', function (e) {
    var host = ''; try { host = new URL(e.origin).hostname; } catch (x) {}
    if (!/(^|\.)(googleusercontent|google)\.com$/.test(host)) return;
    var d = e.data;
    if (!d || typeof d !== 'object') return;
    if (d.type === 'readinglog-pin') {
      put(KEY, '');
      showPin(PIN_TEXT[d.code] || '');
    } else if (d.type === 'readinglog-size' && standalone && innerHeight >= innerWidth && frame.offsetHeight) {
      // Google's page leaves an empty strip (about 49px) under the app. If the app reports less height than
      // the iframe has (minus what we already reserved), reserve the difference so the tab bar reaches the bottom.
      var shortfall = (frame.offsetHeight - reserved) - d.h;
      if (shortfall > 3 && shortfall <= 80) {
        reserved = Math.min(120, reserved + shortfall);
        put(RKEY, String(reserved));
        fit();
      }
    }
  });

  var saved = get(KEY);
  if (saved) start(saved); else showPin('');
})();
</script>
</body></html>
